[package]
name = "ksplit"
version = "0.1.0"
edition = "2021"
description = "Split large CSV files by key ranges, streaming with resume support"
license = "MIT OR Apache-2.0"

[lib]
name = "ksplit"
path = "src/lib.rs"

[[bin]]
name = "ksplit"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ctrlc"]

[dependencies]
memchr = "2"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
